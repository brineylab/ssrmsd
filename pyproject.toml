[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ssrmsd"
version = "0.1.0"
description = "Self-consistency RMSD (ssRMSD) scoring for predicted antibody-antigen structure ensembles."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.6.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ssrmsd = "ssrmsd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssrmsd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
