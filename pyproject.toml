[build-system]
requires = ["hatchling>=1.25", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ssRMSD"
dynamic = ["version"]
description = "Self-consistency RMSD (ssRMSD) scoring for predicted antibody-antigen structure ensembles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "gemmi>=0.6.5",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty==0.0.40",
]

[project.scripts]
ssrmsd = "ssrmsd.cli:app"

[project.urls]
Homepage = "https://github.com/brineylab/ssrmsd"
Repository = "https://github.com/brineylab/ssrmsd"
Issues = "https://github.com/brineylab/ssrmsd/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
scm.git.describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssrmsd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
